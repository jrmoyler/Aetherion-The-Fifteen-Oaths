<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1150" viewBox="0 0 1500 1150"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#21586b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#1b3041} .small{font-size:14px} .label{font-size:17px;font-weight:bold} .note{font-size:16px} .edge{stroke:#809599;stroke-width:3;fill:none} .service{stroke:#007e83;stroke-width:7;fill:none} </style><rect width="1500" height="1150" fill="#f7f5ee"/><text x="45" y="48" font-size="30" font-weight="bold">Parallax Crown: district plan + unfolded terrain section</text><text x="45" y="78" class="note">PROPOSED • 10 • schematic composition, not coordinates • all dimensions require blockout review</text><line x1="45" y1="100" x2="1455" y2="100" stroke="#b7bdb4"/><text x="45" y="130" class="label">PLAN / ordinary district connections</text><rect x="35" y="145" width="825" height="540" rx="18" fill="#ecede5" stroke="#c5c8bc"/><path d="M70 540 Q130 210 350 180 T790 470" fill="none" stroke="#c3b6a3" stroke-width="28" opacity="0.45"/><line x1="170" y1="595" x2="340" y2="505" class="edge"/><line x1="340" y1="505" x2="500" y2="405" class="edge"/><line x1="500" y1="405" x2="610" y2="265" class="edge"/><line x1="610" y1="265" x2="740" y2="195" class="edge"/><line x1="740" y1="195" x2="340" y2="505" class="edge"/><line x1="340" y1="505" x2="180" y2="345" class="edge"/><line x1="180" y1="345" x2="170" y2="595" class="edge"/><line x1="170" y1="595" x2="740" y2="195" class="edge"/><line x1="170" y1="595" x2="340" y2="505" class="service"/><line x1="340" y1="505" x2="180" y2="345" class="service"/><path d="M170 595 L95 650" stroke="#21586b" stroke-width="3" marker-end="url(#arrow)"/><text x="95" y="668" text-anchor="middle" font-size="11" font-weight="bold">PUBLIC ARRIVAL</text><path d="M500 405 L590 460" stroke="#21586b" stroke-width="3" marker-end="url(#arrow)"/><text x="590" y="478" text-anchor="middle" font-size="11" font-weight="bold">SERVICE INGRESS</text><path d="M180 345 L115 295" stroke="#21586b" stroke-width="3" marker-end="url(#arrow)"/><text x="115" y="313" text-anchor="middle" font-size="11" font-weight="bold">RELIEF EXIT</text><circle cx="170" cy="595" r="23" fill="#fffdf7" stroke="#1c6572" stroke-width="3"/><text x="170" y="601" text-anchor="middle" class="label">D0</text><circle cx="340" cy="505" r="23" fill="#fffdf7" stroke="#1c6572" stroke-width="3"/><text x="340" y="511" text-anchor="middle" class="label">D1</text><circle cx="500" cy="405" r="23" fill="#fffdf7" stroke="#1c6572" stroke-width="3"/><text x="500" y="411" text-anchor="middle" class="label">D2</text><circle cx="180" cy="345" r="23" fill="#fffdf7" stroke="#1c6572" stroke-width="3"/><text x="180" y="351" text-anchor="middle" class="label">D3</text><circle cx="610" cy="265" r="23" fill="#fffdf7" stroke="#1c6572" stroke-width="3"/><text x="610" y="271" text-anchor="middle" class="label">D4</text><circle cx="740" cy="195" r="23" fill="#fffdf7" stroke="#1c6572" stroke-width="3"/><text x="740" y="201" text-anchor="middle" class="label">D5</text><text x="900" y="130" class="label">DISTRICT KEY / terrain layers</text><text x="900" y="165" class="label">D0 Ballast Gate</text><text x="900" y="187" class="small">mainland cargo, visitor rest and conventional lift depot</text><text x="900" y="205" class="small">Level -5…5 m • footprint 250–350 × 200–300 m</text><text x="900" y="239" class="label">D1 Parallax Court</text><text x="900" y="261" class="small">public research accounts and orientation hall</text><text x="900" y="279" class="small">Level 25…35 m • footprint 150–250 × 150–250 m</text><text x="900" y="313" class="label">D2 Instrument Terraces</text><text x="900" y="335" class="small">calibration workshops and matte sighting bays</text><text x="900" y="353" class="small">Level 45…55 m • footprint 250–400 × 200–350 m</text><text x="900" y="387" class="label">D3 Steady Hearths</text><text x="900" y="409" class="small">ordinary-gravity housing and gardens</text><text x="900" y="427" class="small">Level 5…15 m • footprint 250–400 × 200–350 m</text><text x="900" y="461" class="label">D4 Meridian College</text><text x="900" y="483" class="small">comparison instruments and public model archive</text><text x="900" y="501" class="small">Level 65…75 m • footprint 150–300 × 150–250 m</text><text x="900" y="535" class="label">D5 Anchor Crown</text><text x="900" y="557" class="small">bounded experimental platforms and field controls</text><text x="900" y="575" class="small">Level 95…105 m • footprint 150–300 × 150–300 m</text><line x1="45" y1="710" x2="1455" y2="710" stroke="#b7bdb4"/><text x="45" y="745" class="label">UNFOLDED SECTION / district index order, not a straight geographic transect</text><polygon points="50,1010.0 50,955.0 160,955.0 175,920.5 285,920.5 300,897.5 410,897.5 425,943.5 535,943.5 550,874.5 660,874.5 675,840.0 785,840.0 785,1010.0" fill="#d6cbbb" stroke="#9f9381" stroke-width="2"/><rect x="73" y="915.0" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M65 915.0 L100 900.0 L135 915.0" fill="none" stroke="#436572" stroke-width="2"/><text x="99" y="890.0" text-anchor="middle" class="label">D0</text><text x="99" y="983.0" text-anchor="middle" class="small">+0 m</text><rect x="198" y="880.5" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M190 880.5 L225 865.5 L260 880.5" fill="none" stroke="#436572" stroke-width="2"/><text x="224" y="855.5" text-anchor="middle" class="label">D1</text><text x="224" y="948.5" text-anchor="middle" class="small">+30 m</text><rect x="323" y="857.5" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M315 857.5 L350 842.5 L385 857.5" fill="none" stroke="#436572" stroke-width="2"/><text x="349" y="832.5" text-anchor="middle" class="label">D2</text><text x="349" y="925.5" text-anchor="middle" class="small">+50 m</text><rect x="448" y="903.5" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M440 903.5 L475 888.5 L510 903.5" fill="none" stroke="#436572" stroke-width="2"/><text x="474" y="878.5" text-anchor="middle" class="label">D3</text><text x="474" y="971.5" text-anchor="middle" class="small">+10 m</text><rect x="573" y="834.5" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M565 834.5 L600 819.5 L635 834.5" fill="none" stroke="#436572" stroke-width="2"/><text x="599" y="809.5" text-anchor="middle" class="label">D4</text><text x="599" y="902.5" text-anchor="middle" class="small">+70 m</text><rect x="698" y="800.0" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M690 800.0 L725 785.0 L760 800.0" fill="none" stroke="#436572" stroke-width="2"/><text x="724" y="775.0" text-anchor="middle" class="label">D5</text><text x="724" y="868.0" text-anchor="middle" class="small">+100 m</text><text x="980" y="790" class="label">SECTION CONSTRAINT</text><text x="980" y="817" class="small">mainland rock anchors → ordinary-gravity service</text><text x="980" y="837" class="small">base → inhabited terraces → sighting halls → bounded</text><text x="980" y="857" class="small">optional platform volume; no separate floating realm</text><text x="980" y="897" class="small">Show separate potable supply, dirty return and storm</text><text x="980" y="917" class="small">overflow at detailed section stage. No occupied room</text><text x="980" y="937" class="small">may lose both exits.</text><text x="45" y="1050" class="note">Teal = protected service walk. Thin links = alternate public streets. Crossings without a circle are not junctions.</text><text x="45" y="1075" class="note">Event, boss and PvP volumes stay outside this service network; their final footprints need terrain and navigation validation.</text><text x="45" y="1110" class="small">Architecture p2-arch-10-observatory-terraces • reference REF-104 • baseline capital poi-10-capital</text></svg>