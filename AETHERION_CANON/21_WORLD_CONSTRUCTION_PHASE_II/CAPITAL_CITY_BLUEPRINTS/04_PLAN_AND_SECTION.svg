small">fish handling, net repair and ferry interchange</text><text x="900" y="353" class="small">Level -5…5 m • footprint 250–400 × 200–350 m</text><text x="900" y="387" class="label">D3 Dry Hearths</text><text x="900" y="409" class="small">raised residential courts</text><text x="900" y="427" class="small">Level 5…15 m • footprint 250–400 × 200–350 m</text><text x="900" y="461" class="label">D4 Sluice College</text><text x="900" y="483" class="small">salinity testing and rescue instruction</text><text x="900" y="501" class="small">Level 0…10 m • footprint 150–300 × 150–250 m</text><text x="900" y="535" class="label">D5 Reef Walk</text><text x="900" y="557" class="small">shore-attached workshops and managed nursery overlook</text><text x="900" y="575" class="small">Level -5…5 m • footprint 150–300 × 150–300 m</text><text x="900" y="609" class="label">D6 Surge Refuge</text><text x="900" y="631" class="small">elevated storehouses and evacuation assembly</text><text x="900" y="649" class="small">Level 10…20 m • footprint 200–350 × 200–300 m</text><line x1="45" y1="710" x2="1455" y2="710" stroke="#b7bdb4"/><text x="45" y="745" class="label">UNFOLDED SECTION / district index order, not a straight geographic transect</text><polygon points="50,1010.0 50,949.2 160,949.2 175,949.2 285,949.2 300,955.0 410,955.0 425,943.5 535,943.5 550,949.2 660,949.2 675,955.0 785,955.0 800,937.8 910,937.8 910,1010.0" fill="#d6cbbb" stroke="#9f9381" stroke-width="2"/><rect x="73" y="909.25" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M65 909.25 L100 894.25 L135 909.25" fill="none" stroke="#436572" stroke-width="2"/><text x="99" y="884.25" text-anchor="middle" class="label">D0</text><text x="99" y="977.25" text-anchor="middle" class="small">+5 m</text><rect x="198" y="909.25" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M190 909.25 L225 894.25 L260 909.25" fill="none" stroke="#436572" stroke-width="2"/><text x="224" y="884.25" text-anchor="middle" class="label">D1</text><text x="224" y="977.25" text-anchor="middle" class="small">+5 m</text><rect x="323" y="915.0" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M315 915.0 L350 900.0 L385 915.0" fill="none" stroke="#436572" stroke-width="2"/><text x="349" y="890.0" text-anchor="middle" class="label">D2</text><text x="349" y="983.0" text-anchor="middle" class="small">+0 m</text><rect x="448" y="903.5" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M440 903.5 L475 888.5 L510 903.5" fill="none" stroke="#436572" stroke-width="2"/><text x="474" y="878.5" text-anchor="middle" class="label">D3</text><text x="474" y="971.5" text-anchor="middle" class="small">+10 m</text><rect x="573" y="909.25" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M565 909.25 L600 894.25 L635 909.25" fill="none" stroke="#436572" stroke-width="2"/><text x="599" y="884.25" text-anchor="middle" class="label">D4</text><text x="599" y="977.25" text-anchor="middle" class="small">+5 m</text><rect x="698" y="915.0" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M690 915.0 L725 900.0 L760 915.0" fill="none" stroke="#436572" stroke-width="2"/><text x="724" y="890.0" text-anchor="middle" class="label">D5</text><text x="724" y="983.0" text-anchor="middle" class="small">+0 m</text><rect x="823" y="897.75" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M815 897.75 L850 882.75 L885 897.75" fill="none" stroke="#436572" stroke-width="2"/><text x="849" y="872.75" text-anchor="middle" class="label">D6</text><text x="849" y="965.75" text-anchor="middle" class="small">+15 m</text><text x="980" y="790" class="label">SECTION CONSTRAINT</text><text x="980" y="817" class="small">piled or rock-founded support → floodable service</text><text x="980" y="837" class="small">apron → dry public causeway → raised inhabited</text><text x="980" y="857" class="small">floors → refuge roof; no mandatory submerged</text><text x="980" y="877" class="small">corridor</text><text x="980" y="917" class="small">Show separate potable supply, dirty return and storm</text><text x="980" y="937" class="small">overflow at detailed section stage. No occupied room</text><text x="980" y="957" class="small">may lose both exits.</text><text x="45" y="1050" class="note">Teal = protected service walk. Thin links = alternate public streets. Crossings without a circle are not junctions.</text><text x="45" y="1075" class="note">Event, boss and PvP volumes stay outside this service network; their final footprints need terrain and navigation validation.</text><text x="45" y="1110" class="small">Architecture p2-arch-04-tidal-refuges • reference REF-110 • baseline capital poi-04-capital</text></svg>