iddle" class="small">-10 m</text><rect x="448" y="863.25" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M440 863.25 L475 848.25 L510 863.25" fill="none" stroke="#436572" stroke-width="2"/><text x="474" y="838.25" text-anchor="middle" class="label">D3</text><text x="474" y="931.25" text-anchor="middle" class="small">+20 m</text><rect x="573" y="840.25" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M565 840.25 L600 825.25 L635 840.25" fill="none" stroke="#436572" stroke-width="2"/><text x="599" y="815.25" text-anchor="middle" class="label">D4</text><text x="599" y="908.25" text-anchor="middle" class="small">+40 m</text><rect x="698" y="915.0" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M690 915.0 L725 900.0 L760 915.0" fill="none" stroke="#436572" stroke-width="2"/><text x="724" y="890.0" text-anchor="middle" class="label">D5</text><text x="724" y="983.0" text-anchor="middle" class="small">-25 m</text><text x="980" y="790" class="label">SECTION CONSTRAINT</text><text x="980" y="817" class="small">stable basalt foundation → drained service crawl →</text><text x="980" y="837" class="small">inhabited rim ledge → vented kiln roofs; active</text><text x="980" y="857" class="small">vents remain outside foundations</text><text x="980" y="897" class="small">Quench sits below Kiln Aprons; a separate closed</text><text x="980" y="917" class="small">pump return lifts cooled process water. Potable</text><text x="980" y="937" class="small">supply is not this loop.</text><text x="45" y="1050" class="note">Teal = protected service walk. Thin links = alternate public streets. Crossings without a circle are not junctions.</text><text x="45" y="1075" class="note">Event, boss and PvP volumes stay outside this service network; their final footprints need terrain and navigation validation.</text><text x="45" y="1110" class="small">Architecture p2-arch-01-kiln-courts • reference RE