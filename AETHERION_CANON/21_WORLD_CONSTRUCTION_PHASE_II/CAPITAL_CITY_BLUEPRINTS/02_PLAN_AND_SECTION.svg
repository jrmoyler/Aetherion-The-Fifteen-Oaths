" stroke="#436572" stroke-width="2"/><text x="599" y="855.5" text-anchor="middle" class="label">D4</text><text x="599" y="948.5" text-anchor="middle" class="small">+30 m</text><text x="980" y="790" class="label">SECTION CONSTRAINT</text><text x="980" y="817" class="small">bedrock anchors → frost-drained undercroft → warm</text><text x="980" y="837" class="small">occupied rooms → ventilated cold store; no</text><text x="980" y="857" class="small">load-bearing glacial ice</text><text x="980" y="897" class="small">Show separate potable supply, dirty return and storm</text><text x="980" y="917" class="small">overflow at detailed section stage. No occupied room</text><text x="980" y="937" class="small">may lose both exits.</text><text x="45" y="1050" class="note">Teal = protected service walk. Thin links = alternate public streets. Crossings without a circle are not junctions.</text><text x="45" y="1075" class="note">Event, boss and PvP volumes stay outside this service network; their final footprints need terrain and navigation validation.</text><text x="45" y="1110" class="small">Architecture p2-arch-02-rime-vaults • reference REF-112 • baseline capital poi-02-capital</text></svg>