900" y="409" class="small">mixed household courtyards and respite gardens</text><text x="900" y="427" class="small">Level 20…30 m • footprint 250–400 × 200–350 m</text><text x="900" y="461" class="label">D4 Recovery Cloister</text><text x="900" y="483" class="small">care wards, training and quiet records</text><text x="900" y="501" class="small">Level 30…40 m • footprint 150–300 × 150–250 m</text><text x="900" y="535" class="label">D5 Terrace Watch</text><text x="900" y="557" class="small">bridge defense and relief store</text><text x="900" y="575" class="small">Level 35…45 m • footprint 150–300 × 150–300 m</text><line x1="45" y1="710" x2="1455" y2="710" stroke="#b7bdb4"/><text x="45" y="745" class="label">UNFOLDED SECTION / district index order, not a straight geographic transect</text><polygon points="50,1010.0 50,955.0 160,955.0 175,932.0 285,932.0 300,937.8 410,937.8 425,926.2 535,926.2 550,914.8 660,914.8 675,909.0 785,909.0 785,1010.0" fill="#d6cbbb" stroke="#9f9381" stroke-width="2"/><rect x="73" y="915.0" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M65 915.0 L100 900.0 L135 915.0" fill="none" stroke="#436572" stroke-width="2"/><text x="99" y="890.0" text-anchor="middle" class="label">D0</text><text x="99" y="983.0" text-anchor="middle" class="small">+0 m</text><rect x="198" y="892.0" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M190 892.0 L225 877.0 L260 892.0" fill="none" stroke="#436572" stroke-width="2"/><text x="224" y="867.0" text-anchor="middle" class="label">D1</text><text x="224" y="960.0" text-anchor="middle" class="small">+20 m</text><rect x="323" y="897.75" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M315 897.75 L350 882.75 L385 897.75" fill="none" stroke="#436572" stroke-width="2"/><text x="349" y="872.75" text-anchor="middle" class="label">D2</text><text x="349" y="965.75" text-anchor="middle" class="small">+15 m</text><rect x="448" y="886.25" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M440 886.25 L475 871.25 L510 886.25" fill="none" stroke="#436572" stroke-width="2"/><text x="474" y="861.25" text-anchor="middle" class="label">D3</text><text x="474" y="954.25" text-anchor="middle" class="small">+25 m</text><rect x="573" y="874.75" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M565 874.75 L600 859.75 L635 874.75" fill="none" stroke="#436572" stroke-width="2"/><text x="599" y="849.75" text-anchor="middle" class="label">D4</text><text x="599" y="942.75" text-anchor="middle" class="small">+35 m</text><rect x="698" y="869.0" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M690 869.0 L725 854.0 L760 869.0" fill="none" stroke="#436572" stroke-width="2"/><text x="724" y="844.0" text-anchor="middle" class="label">D5</text><text x="724" y="937.0" text-anchor="middle" class="small">+40 m</text><text x="980" y="790" class="label">SECTION CONSTRAINT</text><text x="980" y="817" class="small">river-cut foundation shelf → bridge service apron →</text><text x="980" y="837" class="small">residential terraces → kitchen courts → quiet</text><text x="980" y="857" class="small">recovery cloister; no blood-fed hydrology</text><text x="980" y="897" class="small">Show separate potable supply, dirty return and storm</text><text x="980" y="917" class="small">overflow at detailed section stage. No occupied room</text><text x="980" y="937" class="small">may lose both exits.</text><text x="45" y="1050" class="note">Teal = protected service walk. Thin links = alternate public streets. Crossings without a circle are not junctions.</text><text x="45" y="1075" class="note">Event, boss and PvP volumes stay outside this service network; their final footprints need terrain and navigation validation.</text><text x="45" y="1110" class="small">Architecture p2-arch-12-sanguine-cloisters • reference REF-102 • baseline capital poi-12-capital</text></svg>