ll">raised homes, kitchens and wash gardens</text><text x="900" y="427" class="small">Level 0…10 m • footprint 250–400 × 200–350 m</text><text x="900" y="461" class="label">D4 Witness Laboratory</text><text x="900" y="483" class="small">independent sampling and fictional assay school</text><text x="900" y="501" class="small">Level 0…10 m • footprint 150–300 × 150–250 m</text><text x="900" y="535" class="label">D5 Return Marsh</text><text x="900" y="557" class="small">staged treatment cells and maintenance boardwalks</text><text x="900" y="575" class="small">Level -10…0 m • footprint 150–300 × 150–300 m</text><line x1="45" y1="710" x2="1455" y2="710" stroke="#b7bdb4"/><text x="45" y="745" class="label">UNFOLDED SECTION / district index order, not a straight geographic transect</text><polygon points="50,1010.0 50,949.2 160,949.2 175,943.5 285,943.5 300,949.2 410,949.2 425,943.5 535,943.5 550,943.5 660,943.5 675,955.0 785,955.0 785,1010.0" fill="#d6cbbb" stroke="#9f9381" stroke-width="2"/><rect x="73" y="909.25" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M65 909.25 L100 894.25 L135 909.25" fill="none" stroke="#436572" stroke-width="2"/><text x="99" y="884.25" text-anchor="middle" class="label">D0</text><text x="99" y="977.25" text-anchor="middle" class="small">+0 m</text><rect x="198" y="903.5" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M190 903.5 L225 888.5 L260 903.5" fill="none" stroke="#436572" stroke-width="2"/><text x="224" y="878.5" text-anchor="middle" class="label">D1</text><text x="224" y="971.5" text-anchor="middle" class="small">+5 m</text><rect x="323" y="909.25" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M315 909.25 L350 894.25 L385 909.25" fill="none" stroke="#436572" stroke-width="2"/><text x="349" y="884.25" text-anchor="middle" class="label">D2</text><text x="349" y="977.25" text-anchor="middle" class="small">+0 m</text><rect x="448" y=