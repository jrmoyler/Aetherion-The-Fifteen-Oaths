<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1150" viewBox="0 0 1500 1150"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#21586b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#1b3041} .small{font-size:14px} .label{font-size:17px;font-weight:bold} .note{font-size:16px} .edge{stroke:#809599;stroke-width:3;fill:none} .service{stroke:#007e83;stroke-width:7;fill:none} </style><rect width="1500" height="1150" fill="#f7f5ee"/><text x="45" y="48" font-size="30" font-weight="bold">Aureate Steps: district plan + unfolded terrain section</text><text x="45" y="78" class="note">PROPOSED • 09 • schematic composition, not coordinates • all dimensions require blockout review</text><line x1="45" y1="100" x2="1455" y2="100" stroke="#b7bdb4"/><text x="45" y="130" class="label">PLAN / ordinary district connections</text><rect x="35" y="145" width="825" height="540" rx="18" fill="#ecede5" stroke="#c5c8bc"/><line x1="170" y1="475" x2="410" y2="385" class="edge"/><line x1="410" y1="385" x2="600" y2="265" class="edge"/><line x1="600" y1="265" x2="690" y2="515" class="edge"/><line x1="690" y1="515" x2="410" y2="625" class="edge"/><line x1="410" y1="625" x2="170" y2="475" class="edge"/><line x1="410" y1="385" x2="380" y2="225" class="edge"/><line x1="380" y1="225" x2="170" y2="245" class="edge"/><line x1="170" y1="245" x2="410" y2="385" class="edge"/><line x1="380" y1="225" x2="410" y2="625" class="edge"/><line x1="600" y1="265" x2="410" y2="625" class="edge"/><line x1="170" y1="475" x2="410" y2="385" class="service"/><line x1="410" y1="385" x2="600" y2="265" class="service"/><line x1="600" y1="265" x2="690" y2="515" class="service"/><path d="M170 475 L95 530" stroke="#21586b" stroke-width="3" marker-end="url(#arrow)"/><text x="95" y="548" text-anchor="middle" font-size="11" font-weight="bold">PUBLIC ARRIVAL</text><path d="M600 265 L690 320" stroke="#21586b" stroke-width="3" marker-end="url(#arrow)"/><text x="690" y="338" text-anchor="middle" font-size="11" font-weight="bold">SERVICE INGRESS</text><path d="M690 515 L625 465" stroke="#21586b" stroke-width="3" marker-end="url(#arrow)"/><text x="625" y="483" text-anchor="middle" font-size="11" font-weight="bold">RELIEF EXIT</text><circle cx="170" cy="475" r="23" fill="#fffdf7" stroke="#1c6572" stroke-width="3"/><text x="170" y="481" text-anchor="middle" class="label">D0</text><circle cx="410" cy="385" r="23" fill="#fffdf7" stroke="#1c6572" stroke-width="3"/><text x="410" y="391" text-anchor="middle" class="label">D1</text><circle cx="600" cy="265" r="23" fill="#fffdf7" stroke="#1c6572" stroke-width="3"/><text x="600" y="271" text-anchor="middle" class="label">D2</text><circle cx="690" cy="515" r="23" fill="#fffdf7" stroke="#1c6572" stroke-width="3"/><text x="690" y="521" text-anchor="middle" class="label">D3</text><circle cx="380" cy="225" r="23" fill="#fffdf7" stroke="#1c6572" stroke-width="3"/><text x="380" y="231" text-anchor="middle" class="label">D4</text><circle cx="170" cy="245" r="23" fill="#fffdf7" stroke="#1c6572" stroke-width="3"/><text x="170" y="251" text-anchor="middle" class="label">D5</text><circle cx="410" cy="625" r="23" fill="#fffdf7" stroke="#1c6572" stroke-width="3"/><text x="410" y="631" text-anchor="middle" class="label">D6</text><text x="900" y="130" class="label">DISTRICT KEY / terrain layers</text><text x="900" y="165" class="label">D0 Basin Gate</text><text x="900" y="187" class="small">grain carts and neutral arrival services</text><text x="900" y="205" class="small">Level -5…5 m • footprint 250–350 × 200–300 m</text><text x="900" y="239" class="label">D1 Great Plaza</text><text x="900" y="261" class="small">locked narrative plaza anchor and public assembly</text><text x="900" y="279" class="small">Level 10…20 m • footprint 150–250 × 150–250 m</text><text x="900" y="313" class="label">D2 Makers Arcade</text><text x="900" y="335" class="small">ordinary commerce and repair workshops</text><text x="900" y="353" class="small">Level 0…10 m • footprint 250–400 × 200–350 m</text><text x="900" y="387" class="label">D3 Lantern Homes</text><text x="900" y="409" class="small">mixed households and sanctuary services</text><text x="900" y="427" class="small">Level 5…15 m • footprint 250–400 × 200–350 m</text><text x="900" y="461" class="label">D4 Appeal Court</text><text x="900" y="483" class="small">public testimony and review chambers</text><text x="900" y="501" class="small">Level 15…25 m • footprint 150–300 × 150–250 m</text><text x="900" y="535" class="label">D5 Ward Gardens</text><text x="900" y="557" class="small">bounded protective apparatus and quiet civic park</text><text x="900" y="575" class="small">Level 20…30 m • footprint 150–300 × 150–300 m</text><text x="900" y="609" class="label">D6 Relief Belt</text><text x="900" y="631" class="small">food depots, clinic and uncredentialed evacuation</text><text x="900" y="649" class="small">corridor</text><text x="900" y="667" class="small">Level 5…15 m • footprint 200–350 × 200–300 m</text><line x1="45" y1="710" x2="1455" y2="710" stroke="#b7bdb4"/><text x="45" y="745" class="label">UNFOLDED SECTION / district index order, not a straight geographic transect</text><polygon points="50,1010.0 50,955.0 160,955.0 175,937.8 285,937.8 300,949.2 410,949.2 425,943.5 535,943.5 550,932.0 660,932.0 675,926.2 785,926.2 800,943.5 910,943.5 910,1010.0" fill="#d6cbbb" stroke="#9f9381" stroke-width="2"/><rect x="73" y="915.0" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M65 915.0 L100 900.0 L135 915.0" fill="none" stroke="#436572" stroke-width="2"/><text x="99" y="890.0" text-anchor="middle" class="label">D0</text><text x="99" y="983.0" text-anchor="middle" class="small">+0 m</text><rect x="198" y="897.75" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M190 897.75 L225 882.75 L260 897.75" fill="none" stroke="#436572" stroke-width="2"/><text x="224" y="872.75" text-anchor="middle" class="label">D1</text><text x="224" y="965.75" text-anchor="middle" class="small">+15 m</text><rect x="323" y="909.25" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M315 909.25 L350 894.25 L385 909.25" fill="none" stroke="#436572" stroke-width="2"/><text x="349" y="884.25" text-anchor="middle" class="label">D2</text><text x="349" y="977.25" text-anchor="middle" class="small">+5 m</text><rect x="448" y="903.5" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M440 903.5 L475 888.5 L510 903.5" fill="none" stroke="#436572" stroke-width="2"/><text x="474" y="878.5" text-anchor="middle" class="label">D3</text><text x="474" y="971.5" text-anchor="middle" class="small">+10 m</text><rect x="573" y="892.0" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M565 892.0 L600 877.0 L635 892.0" fill="none" stroke="#436572" stroke-width="2"/><text x="599" y="867.0" text-anchor="middle" class="label">D4</text><text x="599" y="960.0" text-anchor="middle" class="small">+20 m</text><rect x="698" y="886.25" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M690 886.25 L725 871.25 L760 886.25" fill="none" stroke="#436572" stroke-width="2"/><text x="724" y="861.25" text-anchor="middle" class="label">D5</text><text x="724" y="954.25" text-anchor="middle" class="small">+25 m</text><rect x="823" y="903.5" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M815 903.5 L850 888.5 L885 903.5" fill="none" stroke="#436572" stroke-width="2"/><text x="849" y="878.5" text-anchor="middle" class="label">D6</text><text x="849" y="971.5" text-anchor="middle" class="small">+10 m</text><text x="980" y="790" class="label">SECTION CONSTRAINT</text><text x="980" y="817" class="small">drained basin foundations → shaded accessible</text><text x="980" y="837" class="small">contour arcade → plaza and low civic buildings →</text><text x="980" y="857" class="small">bounded ward crown; monumental stairs always have a</text><text x="980" y="877" class="small">legible step-free parallel route</text><text x="980" y="917" class="small">Show separate potable supply, dirty return and storm</text><text x="980" y="937" class="small">overflow at detailed section stage. No occupied room</text><text x="980" y="957" class="small">may lose both exits.</text><text x="45" y="1050" class="note">Teal = protected service walk. Thin links = alternate public streets. Crossings without a circle are not junctions.</text><text x="45" y="1075" class="note">Event, boss and PvP volumes stay outside this service network; their final footprints need terrain and navigation validation.</text><text x="45" y="1110" class="small">Architecture p2-arch-09-daybreak-arcades • reference REF-105 • baseline capital poi-09-capital</text></svg>