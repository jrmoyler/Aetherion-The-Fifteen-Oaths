 L355 505" stroke="#21586b" stroke-width="3" marker-end="url(#arrow)"/><text x="355" y="523" text-anchor="middle" font-size="11" font-weight="bold">RELIEF EXIT</text><circle cx="180" cy="555" r="23" fill="#fffdf7" stroke="#1c6572" stroke-width="3"/><text x="180" y="561" text-anchor="middle" class="label">D0</text><circle cx="180" cy="265" r="23" fill="#fffdf7" stroke="#1c6572" stroke-width="3"/><text x="180" y="271" text-anchor="middle" class="label">D1</text><circle cx="420" cy="265" r="23" fill="#fffdf7" stroke="#1c6572" stroke-width="3"/><text x="420" y="271" text-anchor="middle" class="label">D2</text><circle cx="420" cy="555" r="23" fill="#fffdf7" stroke="#1c6572" stroke-width="3"/><text x="420" y="561" text-anchor="middle" class="label">D3</text><circle cx="670" cy="555" r="23" fill="#fffdf7" stroke="#1c6572" stroke-width="3"/><text x="670" y="561" text-anchor="middle" class="label">D4</text><circle cx="670" cy="265" r="23" fill="#fffdf7" stroke="#1c6572" stroke-width="3"/><text x="670" y="271" text-anchor="middle" class="label">D5</text><text x="900" y="130" class="label">DISTRICT KEY / terrain layers</text><text x="900" y="165" class="label">D0 Plain Gate</text><text x="900" y="187" class="small">disclosed trade, freight and orientation</text><text x="900" y="205" class="small">Level -5…5 m • footprint 250–350 × 200–300 m</text><text x="900" y="239" class="label">D1 Anchor Square</text><text x="900" y="261" class="small">persistent public services and civic debate</text><text x="900" y="279" class="small">Level -5…5 m • footprint 150–250 × 150–250 m</text><text x="900" y="313" class="label">D2 Scene Workshops</text><text x="900" y="335" class="small">timber, textile and facade repair</text><text x="900" y="353" class="small">Level -5…5 m • footprint 250–400 × 200–350 m</text><text x="900" y="387" class="label">D3 Backstage Homes</text><text x="900" y="409" class="small">quiet permanent housing and kitchens</text><text x="900" y="427" class="small">Level 0…10 m • footprint 250–400 × 200–350 m</text><text x="900" y="461" class="label">D4 Perspective School</text><text x="900" y="483" class="small">illusion literacy and evidence comparison</text><text x="900" y="501" class="small">Level 5…15 m • footprint 150–300 × 150–250 m</text><text x="900" y="535" class="label">D5 Manydoor Stages</text><text x="900" y="557" class="small">reconfigurable performance courts</text><text x="900" y="575" class="small">Level 0…10 m • footprint 150–300 × 150–300 m</text><line x1="45" y1="710" x2="1455" y2="710" stroke="#b7bdb4"/><text x="45" y="745" class="label">UNFOLDED SECTION / district index order, not a straight geographic transect</text><polygon points="50,1010.0 50,955.0 160,955.0 175,955.0 285,955.0 300,955.0 410,955.0 425,949.2 535,949.2 550,943.5 660,943.5 675,949.2 785,949.2 785,1010.0" fill="#d6cbbb" stroke="#9f9381" stroke-width="2"/><rect x="73" y="915.0" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M65 915.0 L100 900.0 L135 915.0" fill="none" stroke="#436572" stroke-width="2"/><text x="99" y="890.0" text-anchor="middle" class="label">D0</text><text x="99" y="983.0" text-anchor="middle" class="small">+0 m</text><rect x="198" y="915.0" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M190 915.0 L225 900.0 L260 915.0" fill="none" stroke="#436572" stroke-width="2"/><text x="224" y="890.0" text-anchor="middle" class="label">D1</text><text x="224" y="983.0" text-anchor="middle" class="small">+0 m</text><rect x="323" y="915.0" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M315 915.0 L350 900.0 L385 915.0" fill="none" stroke="#436572" stroke-width="2"/><text x="349" y="890.0" text-anchor="middle" class="label">D2</text><text x="349" y="983.0" text-anchor="middle" class="small">+0 m</text><rect x="448" y="909.25" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M440 909.25 L475 894.25 L510 909.25" fill="none" stroke="#436572" stroke-width="2"/><text x="474" y="884.25" text-anchor="middle" class="label">D3</text><text x="474" y="977.25" text-anchor="middle" class="small">+5 m</text><rect x="573" y="903.5" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M565 903.5 L600 888.5 L635 903.5" fill="none" stroke="#436572" stroke-width="2"/><text x="599" y="878.5" text-anchor="middle" class="label">D4</text><text x="599" y="971.5" text-anchor="middle" class="small">+10 m</text><rect x="698" y="909.25" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M690 909.25 L725 894.25 L760 909.25" fill="none" stroke="#436572" stroke-width="2"/><text x="724" y="884.25" text-anchor="middle" class="label">D5</text><text x="724" y="977.25" text-anchor="middle" class="small">+5 m</text><text x="980" y="790" class="label">SECTION CONSTRAINT</text><text x="980" y="817" class="small">stable drainage foundations → fixed service alley →</text><text x="980" y="837" class="small">occupied structures → reversible facade frame →</text><text x="980" y="857" class="small">lightweight stage canopy; illusions never remove</text><text x="980" y="877" class="small">physical supports</text><text x="980" y="917" class="small">Show separate potable supply, dirty return and storm</text><text x="980" y="937" class="small">overflow at detailed section stage. No occupied room</text><text x="980" y="957" class="small">may lose both exits.</text><text x="45" y="1050" class="note">Teal = protected service walk. Thin links = alternate public streets. Crossings without a circle are not junctions.</text><text x="45" y="1075" class="note">Event, boss and PvP volumes stay outside this service network; their final footprints need terrain and navigation validation.</text><text x="45" y="1110" class="small">Architecture p2-arch-13-folded-stages • reference REF-100 • baseline capital poi-13-capital</text></svg>