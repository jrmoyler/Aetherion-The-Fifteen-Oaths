text x="900" y="427" class="small">Level 20…30 m • footprint 250–400 × 200–350 m</text><text x="900" y="461" class="label">D4 Listening Hall</text><text x="900" y="483" class="small">geology school and public gauge archive</text><text x="900" y="501" class="small">Level 5…15 m • footprint 150–300 × 150–250 m</text><text x="900" y="535" class="label">D5 Daylight Adit</text><text x="900" y="557" class="small">ventilation plant and underground rescue station</text><text x="900" y="575" class="small">Level -25…-15 m • footprint 150–300 × 150–300 m</text><line x1="45" y1="710" x2="1455" y2="710" stroke="#b7bdb4"/><text x="45" y="745" class="label">UNFOLDED SECTION / district index order, not a straight geographic transect</text><polygon points="50,1010.0 50,932.0 160,932.0 175,920.5 285,920.5 300,932.0 410,932.0 425,903.2 535,903.2 550,920.5 660,920.5 675,955.0 785,955.0 785,1010.0" fill="#d6cbbb" stroke="#9f9381" stroke-width="2"/><rect x="73" y="892.0" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M65 892.0 L100 877.0 L135 892.0" fill="none" stroke="#436572" stroke-width="2"/><text x="99" y="867.0" text-anchor="middle" class="label">D0</text><text x="99" y="960.0" text-anchor="middle" class="small">+0 m</text><rect x="198" y="880.5" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M190 880.5 L225 865.5 L260 880.5" fill="none" stroke="#436572" stroke-width="2"/><text x="224" y="855.5" text-anchor="middle" class="label">D1</text><text x="224" y="948.5" text-anchor="middle" class="small">+10 m</text><rect x="323" y="892.0" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M315 892.0 L350 877.0 L385 892.0" fill="none" stroke="#436572" stroke-width="2"/><text x="349" y="867.0" text-anchor="middle" class="label">D2</text><text x="349" y="960.0" text-anchor="middle" class="small">+0 m</text><rect x="448" y="863.25" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M440 863.25 L475 848.25 L510 863.25" fill="none" stroke="#436572" stroke-width="2"/><text x="474" y="838.25" text-anchor="middle" class="label">D3</text><text x="474" y="931.25" text-anchor="middle" class="small">+25 m</text><rect x="573" y="880.5" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M565 880.5 L600 865.5 L635 880.5" fill="none" stroke="#436572" stroke-width="2"/><text x="599" y="855.5" text-anchor="middle" class="label">D4</text><text x="599" y="948.5" text-anchor="middle" class="small">+10 m</text><rect x="698" y="915.0" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M690 915.0 L725 900.0 L760 915.0" fill="none" stroke="#436572" stroke-width="2"/><text x="724" y="890.0" text-anchor="middle" class="label">D5</text><text x="724" y="983.0" text-anchor="middle" class="small">-20 m</text><text x="980" y="790" class="label">SECTION CONSTRAINT</text><text x="980" y="817" class="small">drained bedrock galleries → daylight rescue adit →</text><text x="980" y="837" class="small">shoulder civic road → stepped dwellings → open</text><text x="980" y="857" class="small">buttress crown; every occupied chamber has two</text><text x="980" y="877" class="small">independent egress directions</text><text x="980" y="917" class="small">Show separate potable supply, dirty return and storm</text><text x="980" y="937" class="small">overflow at detailed section stage. No occupied room</text><text x="980" y="957" class="small">may lose both exits.</text><text x="45" y="1050" class="note">Teal = protected service walk. Thin links = alternate public streets. Crossings without a circle are not junctions.</text><text x="45" y="1075" class="note">Event, boss and PvP volumes stay outside this service network; their final footprints need terrain and navigation validation.</text><text x="45" y="1110" class="small">Architecture p2-arch-05-fault-buttresses • reference REF-109 • baseline capital poi-05-capital</text></svg>