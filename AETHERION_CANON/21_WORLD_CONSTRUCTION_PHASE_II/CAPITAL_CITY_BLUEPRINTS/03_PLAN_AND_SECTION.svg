0" stroke="#21586b" stroke-width="3" marker-end="url(#arrow)"/><text x="680" y="398" text-anchor="middle" font-size="11" font-weight="bold">SERVICE INGRESS</text><path d="M340 565 L275 515" stroke="#21586b" stroke-width="3" marker-end="url(#arrow)"/><text x="275" y="533" text-anchor="middle" font-size="11" font-weight="bold">RELIEF EXIT</text><circle cx="180" cy="495" r="23" fill="#fffdf7" stroke="#1c6572" stroke-width="3"/><text x="180" y="501" text-anchor="middle" class="label">D0</text><circle cx="380" cy="265" r="23" fill="#fffdf7" stroke="#1c6572" stroke-width="3"/><text x="380" y="271" text-anchor="middle" class="label">D1</text><circle cx="590" cy="325" r="23" fill="#fffdf7" stroke="#1c6572" stroke-width="3"/><text x="590" y="331" text-anchor="middle" class="label">D2</text><circle cx="340" cy="565" r="23" fill="#fffdf7" stroke="#1c6572" stroke-width="3"/><text x="340" y="571" text-anchor="middle" class="label">D3</text><circle cx="630" cy="525" r="23" fill="#fffdf7" stroke="#1c6572" stroke-width="3"/><text x="630" y="531" text-anchor="middle" class="label">D4</text><circle cx="160" cy="265" r="23" fill="#fffdf7" stroke="#1c6572" stroke-width="3"/><text x="160" y="271" text-anchor="middle" class="label">D5</text><text x="900" y="130" class="label">DISTRICT KEY / terrain layers</text><text x="900" y="165" class="label">D0 Pass Anchor</text><text x="900" y="187" class="small">cargo winches and paper courier house</text><text x="900" y="205" class="small">Level -5…5 m • footprint 250–350 × 200–300 m</text><text x="900" y="239" class="label">D1 Relay Commons</text><text x="900" y="261" class="small">routing council and public announcements</text><text x="900" y="279" class="small">Level 15…25 m • footprint 150–250 × 150–250 m</text><text x="900" y="313" class="label">D2 Cable Court</text><text x="900" y="335" class="small">repair workshops and breaker stores</text><text x="900" y="353" class="small">Level 5…15 m • footprint 250–400 × 200–350 m</text><text x="900" y="387" class="label">D3 Lee Houses</text><text x="900" y="409" class="small">wind-sheltered family courts</text><text x="900" y="427" class="small">Level -15…-5 m • footprint 250–400 × 200–350 m</text><text x="900" y="461" class="label">D4 Signal School</text><text x="900" y="483" class="small">message provenance and routing instruction</text><text x="900" y="501" class="small">Level 25…35 m • footprint 150–300 × 150–250 m</text><text x="900" y="535" class="label">D5 Grounding Field</text><text x="900" y="557" class="small">isolated discharge apparatus</text><text x="900" y="575" class="small">Level -25…-15 m • footprint 150–300 × 150–300 m</text><line x1="45" y1="710" x2="1455" y2="710" stroke="#b7bdb4"/><text x="45" y="745" class="label">UNFOLDED SECTION / district index order, not a straight geographic transect</text><polygon points="50,1010.0 50,932.0 160,932.0 175,909.0 285,909.0 300,920.5 410,920.5 425,943.5 535,943.5 550,897.5 660,897.5 675,955.0 785,955.0 785,1010.0" fill="#d6cbbb" stroke="#9f9381" stroke-width="2"/><rect x="73" y="892.0" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M65 892.0 L100 877.0 L135 892.0" fill="none" stroke="#436572" stroke-width="2"/><text x="99" y="867.0" text-anchor="middle" class="label">D0</text><text x="99" y="960.0" text-anchor="middle" class="small">+0 m</text><rect x="198" y="869.0" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M190 869.0 L225 854.0 L260 869.0" fill="none" stroke="#436572" stroke-width="2"/><text x="224" y="844.0" text-anchor="middle" class="label">D1</text><text x="224" y="937.0" text-anchor="middle" class="small">+20 m</text><rect x="323" y="880.5" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M315 880.5 L350 865.5 L385 880.5" fill="none" stroke="#436572" stroke-width="2"/><text x="349" y="855.5" text-anchor="middle" class="label">D2</text><text x="349" y="948.5" text-anchor="middle" class="small">+10 m</text><rect x="448" y="903.5" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M440 903.5 L475 888.5 L510 903.5" fill="none" stroke="#436572" stroke-width="2"/><text x="474" y="878.5" text-anchor="middle" class="label">D3</text><text x="474" y="971.5" text-anchor="middle" class="small">-10 m</text><rect x="573" y="857.5" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M565 857.5 L600 842.5 L635 857.5" fill="none" stroke="#436572" stroke-width="2"/><text x="599" y="832.5" text-anchor="middle" class="label">D4</text><text x="599" y="925.5" text-anchor="middle" class="small">+30 m</text><rect x="698" y="915.0" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M690 915.0 L725 900.0 L760 915.0" fill="none" stroke="#436572" stroke-width="2"/><text x="724" y="890.0" text-anchor="middle" class="label">D5</text><text x="724" y="983.0" text-anchor="middle" class="small">-20 m</text><text x="980" y="790" class="label">SECTION CONSTRAINT</text><text x="980" y="817" class="small">rock anchor → covered foot gallery → inhabited</text><text x="980" y="837" class="small">saddle courts → cablework → discharge mast; no</text><text x="980" y="857" class="small">residential room shares a grounding shaft</text><text x="980" y="897" class="small">Show separate potable supply, dirty return and storm</text><text x="980" y="917" class="small">overflow at detailed section stage. No occupied room</text><text x="980" y="937" class="small">may lose both exits.</text><text x="45" y="1050" class="note">Teal = protected service walk. Thin links = alternate public streets. Crossings without a circle are not junctions.</text><text x="45" y="1075" class="note">Event, boss and PvP volumes stay outside this service network; their final footprints need terrain and navigation validation.</text><text x="45" y="1110" class="small">Architecture p2-arch-03-storm-relays • reference REF-111 • baseline capital poi-03-capital</text></svg>