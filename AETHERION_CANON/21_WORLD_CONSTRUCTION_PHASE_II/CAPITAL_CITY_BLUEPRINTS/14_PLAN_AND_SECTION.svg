00" y="335" class="small">wheel, clock and transport work</text><text x="900" y="353" class="small">Level -5…5 m • footprint 250–400 × 200–350 m</text><text x="900" y="387" class="label">D3 Pause Gardens</text><text x="900" y="409" class="small">housing, rest and quiet services</text><text x="900" y="427" class="small">Level 5…15 m • footprint 250–400 × 200–350 m</text><text x="900" y="461" class="label">D4 Route College</text><text x="900" y="483" class="small">accident records and route planning</text><text x="900" y="501" class="small">Level 5…15 m • footprint 150–300 × 150–250 m</text><text x="900" y="535" class="label">D5 Express Cut</text><text x="900" y="557" class="small">physically separated high-speed transfer lane</text><text x="900" y="575" class="small">Level -15…-5 m • footprint 150–300 × 150–300 m</text><text x="900" y="609" class="label">D6 Relief Siding</text><text x="900" y="631" class="small">manual detour, emergency stores and recovery crews</text><text x="900" y="649" class="small">Level -5…5 m • footprint 200–350 × 200–300 m</text><line x1="45" y1="710" x2="1455" y2="710" stroke="#b7bdb4"/><text x="45" y="745" class="label">UNFOLDED SECTION / district index order, not a straight geographic transect</text><polygon points="50,1010.0 50,943.5 160,943.5 175,943.5 285,943.5 300,943.5 410,943.5 425,932.0 535,932.0 550,932.0 660,932.0 675,955.0 785,955.0 800,943.5 910,943.5 910,1010.0" fill="#d6cbbb" stroke="#9f9381" stroke-width="2"/><rect x="73" y="903.5" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M65 903.5 L100 888.5 L135 903.5" fill="none" stroke="#436572" stroke-width="2"/><text x="99" y="878.5" text-anchor="middle" class="label">D0</text><text x="99" y="971.5" text-anchor="middle" class="small">+0 m</text><rect x="198" y="903.5" width="54" height="40" fill="#fffaf0" stroke="#436572" stroke-width="2"/><path d="M190 903.5 L225 888.5 L260 903.5" fill="none" stroke="#436572" stroke-width="2"/><text x="224" y="8