<text x="1120" y="855" font-family="sans-serif" font-size="13" fill="#23383d">Adjacent traces do not merge.</text>
<text x="45" y="1070" font-family="sans-serif" font-size="15">Topology is demonstrated; relief, channel geometry, political demarcation and gameplay scale require terrain and narrative review.</text>
<text x="45" y="1096" font-family="sans-serif" font-size="14">Neutral services remain inside existing realms. No Oath binding is required for ordinary exploration.</text>
