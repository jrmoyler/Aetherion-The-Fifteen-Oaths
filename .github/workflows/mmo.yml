name: Aetherion MMO

on:
  pull_request:
    paths: ['game/**', 'server/**', 'shared/**', 'tools/generate-mmo-abilities.mjs', 'tests/pwa-*', 'vercel.json', '.github/workflows/mmo.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci --prefix server && npm ci --prefix game
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Ability catalog is in sync with the castable registry
        run: node tools/generate-mmo-abilities.mjs --check
      - name: Simulation + server tests
        run: npm --prefix server test
      - name: Client regressions
        run: node --test game/test/*.test.mjs game/tests/*.test.mjs game/src/combat/*.test.js game/src/vfx/*.test.js game/src/actors/*.test.js game/src/render/*.test.js game/src/three/*.test.js game/src/three/*.test.mjs game/src/ui/painted-icons.test.mjs tests/pwa-lifecycle.test.mjs tests/pwa-update.test.mjs tests/ability-expansion.test.mjs tests/ability-generation.test.mjs
      - name: Client production build
        run: npm --prefix game run build
      - name: Install test browser
        run: cd game && npx playwright install --with-deps chromium
      - name: Mobile HUD layout regressions
        run: node --test game/test/mobile-hud-layout.browser.mjs
      - name: Production PWA offline smoke
        run: |
          npm --prefix game run preview -- --host 127.0.0.1 --port 4173 > /tmp/aetherion-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID"' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ > /dev/null && break
            sleep 1
          done
          node tests/pwa-offline.browser.mjs http://127.0.0.1:4173
