<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creature Viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #2b2c30; color: #ddd; font: 12px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; }
  #hud { position: absolute; left: 8px; top: 8px; background: rgba(0,0,0,.45); padding: 6px 8px; border-radius: 4px; max-width: 60vw; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">loading…</div>
<script type="module">
// Dev-only creature forge QA page (served by the game's Vite dev server):
//   /assets/creatures/viewer.html                -> every manifest entry in a grid, playing ?clip (default walk)
//   /assets/creatures/viewer.html?id=hound&clip=attack
import { Engine, Scene, ArcRotateCamera, Vector3, HemisphericLight, DirectionalLight, MeshBuilder, StandardMaterial, Color3, Color4, SceneLoader, ShadowGenerator } from '/node_modules/@babylonjs/core/index.js';
import '/node_modules/@babylonjs/loaders/glTF/index.js';

const qs = new URLSearchParams(location.search);
const clip = qs.get('clip') || 'walk';
const engine = new Engine(document.getElementById('c'), true);
const scene = new Scene(engine);
scene.clearColor = new Color4(0.17, 0.18, 0.2, 1);
const hemi = new HemisphericLight('h', new Vector3(0, 1, 0), scene); hemi.intensity = 0.55;
const sun = new DirectionalLight('d', new Vector3(-0.5, -1, 0.6), scene); sun.intensity = 2.2; sun.position = new Vector3(20, 40, -20);
const shadows = new ShadowGenerator(1024, sun); shadows.useBlurExponentialShadowMap = true;
const ground = MeshBuilder.CreateGround('g', { width: 80, height: 80 }, scene);
const gm = new StandardMaterial('gm', scene); gm.diffuseColor = new Color3(0.28, 0.28, 0.3); gm.specularColor = new Color3(0, 0, 0);
ground.material = gm; ground.receiveShadows = true;

const manifest = await (await fetch('./manifest.json')).json();
const list = qs.get('id') ? manifest.filter((m) => m.id === qs.get('id')) : manifest;
const cols = Math.ceil(Math.sqrt(list.length));
let x = 0, z = 0, rowMax = 0, info = [];
for (const [i, m] of list.entries()) {
  const res = await SceneLoader.ImportMeshAsync('', './', m.file.split('/').pop(), scene);
  const root = res.meshes[0];
  const w = Math.max(2, m.height * 1.3);
  root.position = new Vector3(x, 0, z);
  res.meshes.forEach((mm) => shadows.addShadowCaster(mm));
  res.animationGroups.forEach((g) => g.stop());
  const g = res.animationGroups.find((a) => a.name === clip) || res.animationGroups[0];
  if (g) g.start(true);
  info.push(`${m.id}: ${m.tris} tris, ${(m.bytes / 1e6).toFixed(2)} MB, clips ${res.animationGroups.map((a) => a.name).join('/')}`);
  x += w + 1; rowMax = Math.max(rowMax, w);
  if ((i + 1) % cols === 0) { x = 0; z -= rowMax + 1; rowMax = 0; }
}
const cam = new ArcRotateCamera('cam', -Math.PI * 0.62, 1.15, 10, new Vector3(0, 1, 0), scene);
cam.attachControl(document.getElementById('c'), true);
const span = Math.max(4, cols * 3.2);
cam.radius = list.length === 1 ? list[0].height * 1.5 + 1.0 : span * 1.25;
cam.target = list.length === 1 ? new Vector3(0, list[0].height * 0.5, 0) : new Vector3(span * 0.42, 0.8, -span * 0.35);
document.getElementById('hud').textContent = `clip=${clip} | ` + info.join(' · ');
window.__aetherion = { engine, scene };
engine.runRenderLoop(() => scene.render());
addEventListener('resize', () => engine.resize());
</script>
</body>
</html>
